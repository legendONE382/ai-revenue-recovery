# Free background scheduler for hosts without frequent cron (e.g. Vercel Hobby).
# Repo -> Settings -> Secrets and variables -> Actions -> add APP_URL and CRON_SECRET.
# GitHub runs schedules on a best-effort basis (typically every 5-15 min).
name: Scheduler tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/cron/tick
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET secrets not set - skipping."
            exit 0
          fi
          curl -fsS --max-time 15 -X POST "${APP_URL%/}/api/cron/tick" -H "Authorization: Bearer $CRON_SECRET"
          echo ""
          echo "Tick completed successfully."
